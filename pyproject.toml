[build-system]
requires = ["maturin>=1.9.4,<2.0"]
build-backend = "maturin"

[project]
name = "datalake-medallion-sdk"
version = "0.1.0rc1"
description = "Contract-enforced Bronze-layer ingestion for medallion data lakes: JSON Schema validation, PII pseudonymization, dead-letter quarantine and Hive-partitioned Parquet on S3"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-APACHE", "LICENSE-MIT", "NOTICE"]
authors = [{ name = "Igor Ramirez Almanza" }]
keywords = ["datalake", "medallion", "bronze", "parquet", "arrow", "data-contracts", "json-schema", "pii", "s3"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Typing :: Typed",
]
# No mandatory runtime dependencies: Arrow input uses the PyCapsule interface.
dependencies = []

[project.optional-dependencies]
pyarrow = ["pyarrow>=14"]
polars = ["polars>=1.0"]
dev = [
    "maturin>=1.9.4,<2.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "mypy>=1.11",
    "ruff>=0.7",
    "pyarrow>=14",
    "polars>=1.0",
    "moto[server]>=5.0",
    "boto3>=1.34",
]

[project.urls]
Homepage = "https://github.com/cluu-ai/datalake-medallion-sdk"
Repository = "https://github.com/cluu-ai/datalake-medallion-sdk"
Issues = "https://github.com/cluu-ai/datalake-medallion-sdk/issues"
Changelog = "https://github.com/cluu-ai/datalake-medallion-sdk/blob/main/CHANGELOG.md"
Security = "https://github.com/cluu-ai/datalake-medallion-sdk/security/policy"

[tool.maturin]
manifest-path = "datalake-medallion-sdk/Cargo.toml"
module-name = "datalake_medallion_sdk._core"
features = ["pyo3/extension-module"]
python-source = "python"
strip = true
include = [{ path = "LICENSE-APACHE", format = "sdist" }, { path = "LICENSE-MIT", format = "sdist" }, { path = "NOTICE", format = "sdist" }]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["pytests"]
addopts = "--tb=short --strict-markers"
markers = ["localstack: requires a LocalStack S3 endpoint (AWS_ENDPOINT_URL)"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["python/datalake_medallion_sdk"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "ANN", "S", "RUF"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"pytests/*" = ["ANN", "S101", "S105", "S106", "S603"]
"python/datalake_medallion_sdk/decorators.py" = ["S311"]
