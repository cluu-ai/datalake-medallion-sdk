[build-system]
requires = ["maturin>=1.9.4,<2.0"]
build-backend = "maturin"

[project]
name = "datalake-medallion-sdk"
version = "0.4.0"
description = "Build and serve multi-tenant medallion data lakes on S3: contract-checked Bronze ingestion, Silver and Gold Iceberg writes and maintenance, and tenant-scoped Parquet/Iceberg reads without Athena. Per-call tenancy, any input (Arrow, Polars, DuckDB, JSON, files), optional PII protection. Rust core, Python API"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-APACHE", "LICENSE-MIT", "NOTICE"]
authors = [{ name = "Igor Ramirez Almanza" }]
keywords = ["datalake", "lakehouse", "medallion", "bronze", "silver", "gold", "iceberg", "parquet", "arrow", "data-contracts", "json-schema", "multi-tenant", "pii", "s3", "polars", "duckdb"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Typing :: Typed",
]
# No mandatory runtime dependencies: Arrow input uses the PyCapsule interface.
dependencies = []

[project.optional-dependencies]
pyarrow = ["pyarrow>=14", "tzdata>=2025.1; sys_platform == 'win32'"]
polars = ["polars>=1.0"]
# LakeReader engines: polars (default, fastest) or DuckDB (lowest memory).
read = [
    "pyarrow>=14",
    "polars>=1.20",
    "pyiceberg[pyiceberg-core]>=0.9",
    "tzdata>=2025.1; sys_platform == 'win32'",
]
duckdb = ["pyarrow>=14", "duckdb>=1.2"]
# Spans and metrics of the SDK's own operations, through the OpenTelemetry API
# only: the application's OpenTelemetry SDK decides where they go.
otel = ["opentelemetry-api>=1.20"]
# LakeWriter / LakeMaintenance: Silver and Gold Iceberg writes. PyIceberg 0.12
# brings commit retries with conflict validation; compaction uses its data
# file writer, so the minor version is pinned and tested.
write = [
    "pyarrow>=14",
    "pyiceberg[pyiceberg-core]>=0.12,<0.13",
    "tzdata>=2025.1; sys_platform == 'win32'",
]
dev = [
    "maturin>=1.9.4,<2.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    # Reference OTLP encoder for the JSON/protobuf differential tests.
    "opentelemetry-proto>=1.20",
    "pytest-cov>=5.0",
    "mypy>=1.11",
    "ruff>=0.7",
    "pyarrow>=14",
    "polars>=1.20",
    "pyiceberg[pyiceberg-core,sql-sqlite]>=0.9",
    "duckdb>=1.2",
    "moto[server]>=5.0",
    "boto3>=1.34",
    "tzdata>=2025.1; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://github.com/cluu-ai/datalake-medallion-sdk"
Repository = "https://github.com/cluu-ai/datalake-medallion-sdk"
Issues = "https://github.com/cluu-ai/datalake-medallion-sdk/issues"
Changelog = "https://github.com/cluu-ai/datalake-medallion-sdk/blob/main/CHANGELOG.md"
Security = "https://github.com/cluu-ai/datalake-medallion-sdk/security/policy"

[tool.maturin]
manifest-path = "datalake-medallion-sdk/Cargo.toml"
module-name = "datalake_medallion_sdk._core"
features = ["pyo3/extension-module"]
python-source = "python"
strip = true
include = [{ path = "LICENSE-APACHE", format = "sdist" }, { path = "LICENSE-MIT", format = "sdist" }, { path = "NOTICE", format = "sdist" }]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["pytests"]
addopts = "--tb=short --strict-markers"
markers = ["localstack: requires a LocalStack S3 endpoint (AWS_ENDPOINT_URL)"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["python/datalake_medallion_sdk"]

[[tool.mypy.overrides]]
# pyarrow ships no type information.
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "ANN", "S", "RUF"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"pytests/*" = ["ANN", "S101", "S105", "S106", "S603"]
"python/datalake_medallion_sdk/decorators.py" = ["S311"]
