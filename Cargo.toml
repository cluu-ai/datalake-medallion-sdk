[workspace]
members = ["datalake-medallion-sdk"]
resolver = "2"

[workspace.package]
version = "0.2.0-rc.10"
edition = "2021"
rust-version = "1.94.1"
authors = ["Igor Ramirez Almanza"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/cluu-ai/datalake-medallion-sdk"
homepage = "https://github.com/cluu-ai/datalake-medallion-sdk"
documentation = "https://docs.rs/datalake-medallion-sdk"
keywords = ["datalake", "medallion", "parquet", "arrow", "data-contracts"]
categories = ["database", "encoding", "api-bindings"]

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.bench]
inherits = "release"
# Line tables are enough for profilers and use far less memory than full debug info.
debug = "line-tables-only"

[profile.test]
opt-level = 1
