[package]
name = "datalake-medallion-sdk-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
datalake-medallion-sdk = { path = ".." }
serde_json = "1.0"

[[bin]]
name = "contract_compile"
path = "fuzz_targets/contract_compile.rs"
test = false
doc = false

[[bin]]
name = "otlp_logs"
path = "fuzz_targets/otlp_logs.rs"
test = false
doc = false
