[package]
name = "datalake-medallion-sdk"
description = "Contract-enforced Bronze-layer ingestion SDK for medallion data lakes: JSON Schema validation, PII pseudonymization, dead-letter quarantine and Hive-partitioned Parquet on object storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../README.md"

[lib]
name = "_core"
crate-type = ["cdylib", "rlib"]
# Benchmarks live in benches/ (Criterion); libtest's bench harness rejects Criterion flags.
bench = false

[dependencies]
# Python bridge
pyo3 = { version = "0.29", features = ["abi3-py312"], optional = true }
pyo3-async-runtimes = { version = "0.29", features = ["tokio-runtime"], optional = true }

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
async-trait = "0.1"

# Object storage
aws-config = "1"
# Without the legacy `rustls` feature (hyper 0.14 + rustls 0.21 stack).
aws-sdk-s3 = { version = "1", default-features = false, features = ["sigv4a", "http-1x", "default-https-client", "rt-tokio"] }
bytes = "1"

# Columnar data
arrow = { version = "60", features = ["json", "ffi"] }
parquet = { version = "60", default-features = false, features = ["arrow", "snap", "zstd"] }

# Contracts and validation
# No remote or file $ref resolution: contracts must be self-contained, and
# compiling a schema must never perform network I/O. `idna` keeps the
# `idn-email` and `idn-hostname` formats asserted (offline, pure Rust).
jsonschema = { version = "0.58", default-features = false, features = ["idna"] }
serde = { version = "1", features = ["derive"] }
# `float_roundtrip`: JSON text parses to the exact f64 it was printed from, so
# Arrow input gives the same numbers on the columnar and the row path.
serde_json = { version = "1", features = ["raw_value", "float_roundtrip"] }

# PII protection: pseudonymization (SHA-256, HMAC) and envelope encryption
# (AES-256-GCM with a host-provided data key, e.g. from AWS KMS per tenant).
sha2 = "0.11"
hmac = "0.13"
hex = "0.4"
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "alloc", "zeroize"] }
base64 = "0.23"
getrandom = "0.4"

# Identifiers and time
ulid = "3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# CPU parallelism for batch validation and masking
rayon = "1"

# Errors and observability
thiserror = "2"
tracing = "0.1"

[features]
default = ["python"]
# Python bindings (the `datalake_medallion_sdk._core` extension module). Rust
# applications can use `default-features = false` and need no Python at all.
python = ["dep:pyo3", "dep:pyo3-async-runtimes", "arrow/pyarrow"]

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "test-util"] }
tempfile = "3"
proptest = "1"
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "bench_pipeline"
harness = false

[[bench]]
name = "bench_parquet_encoding"
harness = false

[[bench]]
name = "bench_pii_masking"
harness = false

[[bench]]
name = "bench_schema_validation"
harness = false
